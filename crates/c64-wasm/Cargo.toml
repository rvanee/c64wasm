[package]
name = "c64-wasm"
version = "0.1.0"
edition = "2021"
authors = ["R.F. van Ee"]
license = "MIT OR Apache-2.0"
description = "WebAssembly bindings for c64-core"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
c64-core = { path = "../c64-core" }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
