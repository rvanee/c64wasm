# Test, build and publish c64wasm.
#
# On every push and pull request: check formatting and lints, run the Rust
# and JavaScript tests, and build the WebAssembly page. On a push to main: also publish the page to GitHub Pages.
# On a tag like v1.0: also attach a zip of the built page to a GitHub release.
#
# No Commodore ROMs are stored anywhere: the test job rebuilds them from
# public listings for its own run (see web/tools/rebuild-roms.mjs), and
# visitors of the page supply (or let the page rebuild) their own.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --release --workspace --all-targets -- -D warnings
      # The ROMs can't be in the repository, so they are rebuilt from public
      # listings, as the page does for visitors, into roms/ (which is never
      # committed, cached or uploaded). If a site is down, the ROM is missing,
      # a warning is shown and the tests that need it skip themselves.
      - name: Rebuild the Commodore ROMs from public listings
        run: node web/tools/rebuild-roms.mjs
      - name: Rust tests
        run: cargo test --release --workspace
      - name: Web page tests (ROM rebuilding)
        working-directory: web
        run: node --test

  web:
    name: Build the web page
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used to attach the zip to a release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Find the wasm-bindgen version in Cargo.lock
        id: wbg
        run: |
          v=$(grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep version | head -1 | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Install wasm-bindgen-cli ${{ steps.wbg.outputs.version }}
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wbg.outputs.version }}
      - name: Build the WebAssembly module
        run: |
          cargo build --release --target wasm32-unknown-unknown -p c64-wasm
          wasm-bindgen target/wasm32-unknown-unknown/release/c64_wasm.wasm \
            --out-dir web/pkg --target web --no-typescript
      - name: Add the test disks
        run: |
          mkdir -p web/disks
          cp crates/c64-core/test-disks/*.d64 web/disks/
      - name: Check the page's JavaScript
        run: |
          find web -name '*.js' -o -name '*.mjs' | while read -r f; do cp "$f" /tmp/check.mjs; node --check /tmp/check.mjs || exit 1; done
      - name: Zip the page
        run: cd web && zip -qr ../c64wasm-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: c64wasm-web
          path: c64wasm-web.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: c64wasm-web.zip

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
